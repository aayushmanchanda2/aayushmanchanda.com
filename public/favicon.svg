<!--
  The site mark at favicon size, which is the A on its own rather than the AM
  lockup in `src/components/SiteMark.astro`. That is a measurement, not a
  preference: rasterised into 16x16 the lockup has no fully inked pixel at all
  — 0.81 device pixels of stroke, 87% peak ink — where this A has eighteen
  pixels at 100%. A monogram that arrives as a grey smudge in a tab strip is
  worse than one letter that arrives sharp.

  The two paths below are byte-for-byte the A inside the lockup, and `lib/
  mark.test.mjs` fails if they stop being. Nothing in the lockup touches
  anything, so the A lifts out of it whole: this file holds a component of that
  drawing, not a fragment of it.

  Colours are pinned rather than left to `currentColor` because a favicon
  renders with nothing to inherit from, and they answer to the browser's own
  `prefers-color-scheme` rather than to the site's `data-theme`: this glyph sits
  in the tab strip, not on the page, so it should match the chrome around it and
  not a theme a reader pinned for the document. The two values are the
  foreground ink token in each theme (`src/styles/global.css`).

  **Never spell a CSS custom property out in this comment.** XML forbids a
  double hyphen anywhere inside a comment, so writing that token with its two
  leading hyphens makes the whole file fail to parse and the browser draws a
  broken image instead of the mark. That is not hypothetical: the line above
  named it directly, this file stopped being valid XML, and nothing caught it,
  because a tab strip with no icon in it looks like a tab strip. It surfaced the
  first time /design rendered this file at 64px beside two smaller copies.
  `lib/mark.test.mjs` fails on it now.

  The crossbar's 0.5-unit gaps are sub-pixel at 16px. That is expected and it is
  why the gap is only 0.5: when it closes, the mark degrades into an ordinary
  solid A rather than into a smudge.
-->
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 16 16">
    <path d="M2.2 14.1 L8 3.1 L13.8 14.1" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt" />
    <path d="M5.9 10.4 H10.1" stroke-width="1.5" stroke-linecap="butt" />
    <style>
        path { stroke: #171717; }
        @media (prefers-color-scheme: dark) {
            path { stroke: #FAFAFA; }
        }
    </style>
</svg>
